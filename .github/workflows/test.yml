name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Syntax check
        # unlock/ bestaat alleen in kamelo-prive (Kamelo for teams), niet in kamelo-open.
        run: find src popup chat tools tests $(ls -d unlock 2>/dev/null) \( -name '*.js' -o -name '*.mjs' \) | xargs -n1 node --check
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: No network requests in extension code
        run: |
          # chat/device.js (antwoorden op dit apparaat) hoort er ook bij; chat.js niet, die praat met de relay (Kamelo Plus).
          if grep -rnE "\b(fetch|XMLHttpRequest|sendBeacon|WebSocket|EventSource)\s*\(" src popup $(ls -d unlock 2>/dev/null) chat/device.js --include='*.js' | grep -v "net-main.js"; then
            echo "Network call found in extension code. Kamelo must not make network requests."; exit 1
          fi
      - run: npm ci
      - run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blokkeert de user namespaces die de sandbox van Chrome nodig heeft.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:browser
