name: Feature request
description: Suggest an idea or a new site, data type or setting.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I use ..., I'd like Kamelo to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works fully on the device, without network requests or a server.
          required: true
