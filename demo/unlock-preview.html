<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kamelo</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="../unlock/unlock.css">
</head>
<body>
  <header class="bar">
    <div class="title-group">
      <img src="../icons/icon128.png" alt="" class="logo">
      <h1 data-i18n="vault"></h1>
    </div>
  </header>

  <div class="hero">
    <div class="lock-icon" id="lockIcon">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path id="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h2 id="title" data-i18n="loading"></h2>
    <p class="footnote center" id="subtitle"></p>
  </div>

  <!-- Nog niet beveiligd -->
  <section id="state-off" hidden>
    <div class="group">
      <button class="row action" id="setupTouch">
        <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 11v3M8.5 9.5a4 4 0 0 1 7 2.5v1c0 3-1 5.5-3 7.5M8 13c0 2.3-.6 4.3-1.7 6M5.5 8.5A7.5 7.5 0 0 1 19.5 12v.5M4.6 15.5c.3-1 .4-2 .4-3.5"/></svg>
        <span class="row-label" data-i18n="setupTouch"></span>
      </button>
      <button class="row action" id="showSetupPassword">
        <svg class="row-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2.5"/><path d="M7.5 12h.01M12 12h.01M16.5 12h.01"/></svg>
        <span class="row-label" data-i18n="usePassword"></span>
      </button>
    </div>
    <form class="group pad" id="setupPasswordForm" hidden>
      <input type="password" id="newPw" data-i18n-placeholder="newPassword" autocomplete="new-password">
      <input type="password" id="newPw2" data-i18n-placeholder="repeatPassword" autocomplete="new-password">
      <button class="plain-btn" type="submit" data-i18n="secureVault"></button>
    </form>
    <p class="footnote" data-i18n="passwordHint"></p>
  </section>

  <!-- Vergrendeld -->
  <section id="state-locked" hidden>
    <div class="group" id="unlockTouchGroup">
      <button class="row action" id="unlockTouch">
        <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 11v3M8.5 9.5a4 4 0 0 1 7 2.5v1c0 3-1 5.5-3 7.5M8 13c0 2.3-.6 4.3-1.7 6M5.5 8.5A7.5 7.5 0 0 1 19.5 12v.5M4.6 15.5c.3-1 .4-2 .4-3.5"/></svg>
        <span class="row-label" data-i18n="unlockTouch"></span>
      </button>
    </div>
    <form class="group pad" id="unlockPasswordForm" hidden>
      <input type="password" id="pw" data-i18n-placeholder="passwordField" autocomplete="current-password">
      <button class="plain-btn" type="submit" data-i18n="unlock"></button>
    </form>
    <p class="footnote" data-i18n="lockedHint"></p>
  </section>

  <!-- Ontgrendeld -->
  <section id="state-open" hidden>
    <div class="group">
      <button class="row action" id="lockNow"><span class="row-label" data-i18n="lockNow"></span></button>
      <button class="row action" id="addTouch" hidden><span class="row-label" data-i18n="addTouch"></span></button>
      <button class="row action" id="showAddPassword" hidden><span class="row-label" data-i18n="addPassword"></span></button>
    </div>
    <form class="group pad" id="addPasswordForm" hidden>
      <input type="password" id="addPw" data-i18n-placeholder="newPassword" autocomplete="new-password">
      <input type="password" id="addPw2" data-i18n-placeholder="repeatPassword" autocomplete="new-password">
      <button class="plain-btn" type="submit" data-i18n="addPassword"></button>
    </form>
    <div class="group">
      <button class="row destructive" id="disable" data-i18n="disable"></button>
    </div>
    <p class="footnote" data-i18n="openHint"></p>
  </section>

  <p class="message" id="message" role="status"></p>

  <script src="popup-seed.js"></script><script src="chrome-shim.js"></script><script src="../src/strings.js"></script>
  <script src="../src/vaultcrypto.js"></script>
  <script src="../src/vaultstore.js"></script><script src="../src/sites.js"></script><script src="../src/config.js"></script><script src="../src/detector.js"></script><script src="../src/vaultscope.js"></script><script src="../src/background.js"></script>
  <script src="../unlock/unlock.js"></script>
</body>
</html>
