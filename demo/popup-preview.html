<!doctype html>
<!-- Gemaakt door tools/build-preview.mjs uit popup/popup.html. Niet met de hand aanpassen. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup preview</title>
  <style>html { background: #555 !important } body { margin: 24px auto !important; border-radius: 12px }</style>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body>
  <!-- ===== Hoofdscherm =====
       Weinig tekst: de site, één statuswoord en de schakelaar; dan Tekst afschermen, het getal van deze maand
       (of bij de eerste keer één knop om het te proberen) en onderaan Kluis | Instellingen. -->
  <div class="view" id="view-main">
    <header class="top">
      <img src="../icons/icon128.png" alt="" class="logo">
      <h1>Kamelo</h1>
    </header>

    <div class="status" id="status" data-state="ai">
      <div class="state" id="state">
        <svg class="ic-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/><path d="m9 12 2.2 2.2L15.2 10"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/><path d="M10 9.5v5M14 9.5v5"/></svg>
        <span id="stateText"></span>
      </div>
      <button class="state reload" id="reloadTab" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg><span data-i18n="statusReload"></span></button>
      <span class="switch big"><input type="checkbox" id="enabled" data-i18n-title="protection"><span class="track"></span></span>
    </div>

    <button class="mask-card" data-open="mask">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/><path d="M11 14h6"/></svg></span>
      <b data-i18n="maskText"></b>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>

    <button class="proof" id="proof" data-open="stats" hidden>
      <span class="n" id="statsValue">0</span>
      <span class="l" data-i18n="monthCaption"></span>
    </button>

    <div class="ready" id="ready" hidden>
      <button class="pill-btn" id="tryIt" type="button" data-i18n="tryIt"></button>
    </div>

    <nav class="foot">
      <button type="button" data-open="vault" id="footVault">
        <svg class="ic-vault" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V7M15.2 12H17"/></svg>
        <svg class="ic-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span data-i18n="vault"></span>
        <em id="total">0</em>
      </button>
      <button type="button" data-open="settings">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span data-i18n="settings"></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </nav>
  </div>

  <!-- ===== Deze maand: alleen tellingen per soort ===== -->
  <div class="view" id="view-stats" hidden>
    <header class="bar">
      <button class="back" data-open="main"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="thisMonth"></h1>
      <span class="spacer"></span>
    </header>
    <div class="group stats">
      <div class="stats-head"><strong id="statsTotal">0</strong><span id="statsCaption"></span></div>
      <div class="stats-list" id="statsList"></div>
    </div>
  </div>

  <!-- ===== Tekst afschermen: voor plekken waar Kamelo niet bij kan (zijbalken, apps). Plak je een antwoord met
       placeholders, dan zet hetzelfde vak de echte gegevens terug. ===== -->
  <div class="view" id="view-mask" hidden>
    <header class="bar">
      <button class="back" data-open="main"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="maskText"></h1>
      <span class="spacer"></span>
    </header>

    <div class="composer" id="composer">
      <textarea id="maskInput" rows="4" data-i18n-placeholder="maskPlaceholder" spellcheck="false"></textarea>
      <div class="result" id="maskResult" hidden>
        <div class="result-head"><span class="result-dot"></span><span id="maskSummary"></span></div>
        <div class="result-text" id="maskPreview"></div>
      </div>
    </div>
    <button class="fill-btn copy-btn" id="maskCopy" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <span id="maskCopyLabel" data-i18n="copyMasked"></span>
    </button>
    <p class="footnote center" id="maskHint" data-i18n="maskFoot"></p>
    <div class="lockpanel" id="maskLocked" hidden>
      <svg class="lock-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <p class="footnote" data-i18n="maskLocked"></p>
      <button class="fill-btn" type="button" data-open="vault" data-i18n="openVault"></button>
    </div>
  </div>

  <!-- ===== Kluis ===== -->
  <div class="view" id="view-vault" hidden>
    <header class="bar">
      <button class="back" data-open="main"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="vault"></h1>
      <span class="bar-end">
        <button class="icon-btn" id="vaultReveal" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </span>
    </header>

    <!-- Vergrendeld: hier ontgrendelen. Touch ID opent een klein venster, want een popup sluit zodra Touch ID om je vingerafdruk vraagt. -->
    <div class="lockpanel" id="lockPanel" hidden>
      <svg class="lock-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <h2 data-i18n="titleLocked"></h2>
      <p class="footnote" data-i18n="lockedHint"></p>
      <button class="fill-btn" id="unlockTouch" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v3M8.5 9.5a4 4 0 0 1 7 2.5v1c0 3-1 5.5-3 7.5M8 13c0 2.3-.6 4.3-1.7 6M5.5 8.5A7.5 7.5 0 0 1 19.5 12v.5M4.6 15.5c.3-1 .4-2 .4-3.5"/></svg>
        <span data-i18n="unlockTouch"></span>
      </button>
      <form class="pw" id="unlockPassword" hidden>
        <input type="password" id="pw" data-i18n-placeholder="passwordField" autocomplete="current-password" required>
        <button class="fill-btn" type="submit" data-i18n="unlock"></button>
      </form>
      <p class="lock-msg" id="lockMsg" role="status"></p>
    </div>

    <div class="search" id="searchBox">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
      <input id="search" type="search" data-i18n-placeholder="search">
    </div>

    <div class="group list blurred" id="vaultList"></div>

    <div class="group" id="vaultActions">
      <button class="row action" id="lockNow" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span class="row-label" data-i18n="lockNow"></span>
      </button>
      <button class="row destructive" id="clear" data-i18n="clearVault"></button>
    </div>
  </div>

  <!-- ===== Instellingen ===== -->
  <!-- Instellingen: drie categorieën met elk een eigen pagina, plus hulp. -->
  <div class="view" id="view-settings" hidden>
    <header class="bar">
      <button class="back" data-open="main"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="settings"></h1>
      <span class="spacer"></span>
    </header>

    <div class="group">
      <button class="row nav cat" data-open="set-mask">
        <span class="cat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/><path d="m9 12 2.2 2.2L15.2 10"/></svg></span>
        <span class="row-label" data-i18n="catMask"></span>
        <span class="row-value" id="catMaskValue"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
      <button class="row nav cat" data-open="set-vault">
        <span class="cat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V7M15.2 12H17"/></svg></span>
        <span class="row-label" data-i18n="catVault"></span>
        <span class="row-value" id="catVaultValue"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
      <button class="row nav cat" data-open="set-sites">
        <span class="cat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
        <span class="row-label" data-i18n="catSites"></span>
        <span class="row-value" id="catSitesValue"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
    </div>

    <div class="group">
      <button class="row nav cat" id="openWelcome" type="button">
        <span class="cat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></svg></span>
        <span class="row-label" data-i18n="howItWorks"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
      <button class="row nav cat" id="report" type="button">
        <span class="cat-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></span>
        <span class="row-label" data-i18n="reportProblem"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
    </div>
    <p class="footnote center-note" id="versionNote"></p>
  </div>

  <!-- Afschermen: wat Kamelo altijd of nooit afschermt, en waarschuwingen. -->
  <div class="view" id="view-set-mask" hidden>
    <header class="bar">
      <button class="back" data-open="settings"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="catMask"></h1>
      <span class="spacer"></span>
    </header>

    <p class="section" data-i18n="alwaysMask"></p>
    <div class="group list" id="customTermsList"></div>
    <form class="add" data-list="customTerms"><input data-i18n-placeholder="alwaysMaskPlaceholder"></form>

    <p class="section" data-i18n="neverMask"></p>
    <div class="group list" id="allowListList"></div>
    <form class="add" data-list="allowList"><input data-i18n-placeholder="neverMaskPlaceholder"></form>

    <div class="group">
      <label class="row">
        <span class="row-label" data-i18n="topicWarnings"></span>
        <span class="switch"><input type="checkbox" id="topicWarnings"><span class="track"></span></span>
      </label>
    </div>
  </div>

  <!-- Kluis: terugzetten, automatisch wissen en beveiliging. -->
  <div class="view" id="view-set-vault" hidden>
    <header class="bar">
      <button class="back" data-open="settings"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="catVault"></h1>
      <span class="spacer"></span>
    </header>

    <div class="group">
      <label class="row">
        <span class="row-label" data-i18n="restoreInAnswers"></span>
        <span class="switch"><input type="checkbox" id="restore"><span class="track"></span></span>
      </label>
      <label class="row">
        <span class="row-label" data-i18n="autoDelete"></span>
        <select id="retention">
          <option value="1" data-i18n="after1"></option>
          <option value="7" data-i18n="after7"></option>
          <option value="30" data-i18n="after30"></option>
          <option value="90" data-i18n="after90"></option>
          <option value="0" data-i18n="never"></option>
        </select>
      </label>
    </div>

    <div class="group">
      <button class="row nav" data-security>
        <span class="tile gray" id="securityTile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <span class="row-label" data-i18n="vaultSecurity"></span>
        <span class="row-value" id="securityValue" data-i18n="off"></span>
        <svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- Sites: deze site als AI behandelen, en de sites die je zo hebt gemarkeerd. -->
  <div class="view" id="view-set-sites" hidden>
    <header class="bar">
      <button class="back" data-open="settings"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg><span data-i18n="back"></span></button>
      <h1 class="center" data-i18n="catSites"></h1>
      <span class="spacer"></span>
    </header>

    <!-- Deze site: alleen op een gewone website (op een bekende AI-site schermt Kamelo de AI-velden al af). -->
    <div id="siteRow" hidden>
      <p class="section" id="siteSection"></p>
      <div class="group">
        <label class="row">
          <span class="row-text"><span class="row-label" data-i18n="treatAsAi"></span><span class="row-sub" data-i18n="treatAsAiHint"></span></span>
          <span class="switch"><input type="checkbox" id="siteAi"><span class="track"></span></span>
        </label>
      </div>
    </div>

    <div id="markedAiSection">
      <p class="section" data-i18n="markedAi"></p>
      <div class="group list" id="customAiSitesList"></div>
      <p class="footnote" data-i18n="markedAiHint"></p>
    </div>
    <p class="footnote" id="sitesEmpty" data-i18n="sitesEmpty"></p>
  </div>

  <script src="popup-seed.js"></script>
  <script src="chrome-shim.js"></script>
  <script src="../src/vaultcrypto.js"></script>
  <script src="../src/vaultstore.js"></script>
  <script src="../src/sites.js"></script>
  <script src="../src/config.js"></script>
  <script src="../src/detector.js"></script>
  <script src="../src/vaultscope.js"></script>
  <script src="../src/background.js"></script>
  <script src="../src/strings.js"></script>
  <script src="../src/vaultlock.js"></script>
  <script src="../src/stats.js"></script>
  <script src="../popup/popup.js"></script>
</body>
</html>
