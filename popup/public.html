<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Melo</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="public.css">
</head>
<body class="pub">
  <!-- Popup van de gratis editie (zie src/edition.js): geen afschermen, geen kluis. Bewust klein: aan/uit
       (Beschermd), Melo (de privéchat, alleen Chrome) en een tijdelijke chat. Kamelo Business gebruikt popup.html. -->
  <div class="view" id="view-main">
    <div class="status" id="status" data-state="ready">
      <div class="state" id="state">
        <svg class="ic-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/><path d="m9 12 2.2 2.2L15.2 10"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/><path d="M10 9.5v5M14 9.5v5"/></svg>
        <svg class="ic-ready" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 5.8v5.4c0 4.3 2.9 8.2 7 9.8 4.1-1.6 7-5.5 7-9.8V5.8z"/></svg>
        <span id="stateText"></span>
      </div>
      <button class="state reload" id="reloadTab" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg><span data-i18n="statusReload"></span></button>
      <span class="switch big"><input type="checkbox" id="enabled" data-i18n-title="onOff"><span class="track"></span></span>
    </div>

    <!-- Melo (de privéchat, alleen Chrome) en een tijdelijke chat: op ChatGPT, Claude en Gemini in hetzelfde tabblad,
         met wat er al in het veld staat; anders een nieuwe in ChatGPT. -->
    <div class="pub-list">
      <button class="pub-row" id="openPrivateChat" type="button">
        <span class="ico melo"><svg viewBox="0 -18 240 240" fill="currentColor" aria-hidden="true"><clipPath id="melo-pub"><path clip-rule="evenodd" d="M-20 -30H260V250H-20ZM11 100.5a34 36.5 0 1 0 68 0a34 36.5 0 1 0 -68 0ZM157.5 99a35.5 38 0 1 0 71 0a35.5 38 0 1 0 -71 0ZM84 140C100 156 136 156 152 140A6 6 0 0 1 152 152C136 168 100 168 84 152A6 6 0 0 1 84 140Z"/></clipPath><g clip-path="url(#melo-pub)"><ellipse cx="43" cy="98" rx="37" ry="45"/><ellipse cx="197" cy="98" rx="38" ry="45.5"/><path d="M57 57C75 42 95 24 112 13C124 5 146 0 156 11C164 22 172 38 188 55L214 130 210 140C210 175 175 196 118 196C62 196 31 178 31 140L28 120Z"/></g><ellipse cx="48" cy="104.5" rx="17.4" ry="19.5"/><ellipse cx="190" cy="103.5" rx="18" ry="20.5"/></svg></span>
        <span class="txt"><b data-i18n="privateChat"></b><span data-i18n="pchatCardSub"></span></span>
        <svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
      <button class="pub-row" id="tempChat" type="button">
        <span class="ico temp"><svg viewBox="4 4 16 16" aria-hidden="true"><path d="M4.5 12c0-4 3.4-7 7.5-7s7.5 3 7.5 7-3.4 7-7.5 7c-1.1 0-2.2-.2-3.1-.6L4.5 19.5l1.1-3.6A6.6 6.6 0 0 1 4.5 12Z"/><circle cx="9" cy="12" r="1.15" fill="#fff"/><circle cx="12" cy="12" r="1.15" fill="#fff"/><circle cx="15" cy="12" r="1.15" fill="#fff"/></svg></span>
        <span class="txt"><b data-i18n="tempChatNew"></b><span data-i18n="tempChatSub"></span></span>
        <svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script src="../src/edition.js"></script>
  <script src="../src/strings.js"></script>
  <script src="../src/sites.js"></script>
  <script src="../src/config.js"></script>
  <script src="public.js"></script>
</body>
</html>
